<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супер Чистка Динамика</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121214;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            background: #1e1e24;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #00adb5; margin-bottom: 10px; }
        p { color: #eeeeee; font-size: 14px; line-height: 1.5; }
        .btn {
            background: #00adb5;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 173, 181, 0.4);
        }
        .btn:active { transform: scale(0.98); }
        .btn.stop { background: #ff2e63; box-shadow: 0 4px 15px rgba(255, 46, 99, 0.4); }
        .modes {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }
        .mode-btn {
            flex: 1;
            background: #393e46;
            color: #eee;
            border: 2px solid transparent;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .mode-btn.active {
            border-color: #00adb5;
            background: #222831;
            color: #00adb5;
        }
        .warning {
            background: #393e46;
            padding: 10px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 12px;
            color: #ffde7d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Speaker Cleaner Pro</h1>
    <p>Эффективное удаление влаги и пыли с помощью направленного звукового резонанса.</p>

    <div class="modes">
        <button class="mode-btn active" onclick="setMode('water')">💧 Вода<br>(165 Гц Синус)</button>
        <button class="mode-btn" onclick="setMode('dust')">💨 Пыль<br>(Импульсный Меандр)</button>
    </div>

    <button id="mainBtn" class="btn" onclick="toggleSound()">ЗАПУСТИТЬ ЧИСТКУ</button>

    <div class="warning">
        ⚠️ <strong>Инструкция:</strong> Включите громкость телефона на максимум (100%). Поверните телефон динамиком вниз.
    </div>
</div>

<script>
    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let isPlaying = false;
    let currentMode = 'water';
    let intervalId = null;

    function setMode(mode) {
        if (isPlaying) toggleSound(); // Останавливаем, если играло
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function startSound() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        oscillator = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (currentMode === 'water') {
            // Идеальная частота для выталкивания воды
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(165, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
        } else if (currentMode === 'dust') {
            // Квадратная волна + прерывание (эффект выбивания пыли)
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(120, audioCtx.currentTime);
            
            // Создаем импульсы (пульсацию)
            let isMuted = false;
            intervalId = setInterval(() => {
                if (isMuted) {
                    gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                } else {
                    gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime); // не 0, чтобы не было щелчков
                }
                isMuted = !isMuted;
            }, 120);
        }

        oscillator.start();
        isPlaying = true;
        
        const btn = document.getElementById('mainBtn');
        btn.textContent = 'ОСТАНОВИТЬ';
        btn.classList.add('stop');
    }

    function stopSound() {
        if (oscillator) {
            oscillator.stop();
            oscillator.disconnect();
        }
        if (intervalId) clearInterval(intervalId);
        if (audioCtx) audioCtx.close();
        
        isPlaying = false;
        
        const btn = document.getElementById('mainBtn');
        btn.textContent = 'ЗАПУСТИТЬ ЧИСТКУ';
        btn.classList.remove('stop');
    }

    function toggleSound() {
        if (!isPlaying) {
            startSound();
        } else {
            stopSound();
        }
    }
</script>

</body>
</html>
