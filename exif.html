<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXIF</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #f4f4f4;
            --accent: #BCFF4F;
            --panel: #181818;
            --border: #333;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 { color: var(--accent); text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        
        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--panel);
            margin-bottom: 20px;
        }
        .dropzone:hover { border-color: var(--accent); background: #1f2316; }
        
        .log-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 80px;
            color: #aaa;
            font-size: 13px;
            border: 1px solid var(--border);
        }
        .log-success { color: var(--accent); font-weight: bold; }
        .log-error { color: #ff4f4f; }
        
        #fileInput { display: none; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

<div class="container">
    <h1>Exif</h1>
    <p class="subtitle">Изображения (JPG, PNG, WEBP) | Документы Office | PDF<br>Вся обработка происходит локально в браузере.</p>
    
    <div class="dropzone" id="dropzone">
        Перетащите файл сюда или нажмите для выбора
        <input type="file" id="fileInput">
    </div>
    
    <div class="log-panel" id="log">Ожидание файла...</div>
</div>

<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const log = document.getElementById('log');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = '#BCFF4F'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = '#333'; });
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.style.borderColor = '#333';
        if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) processFile(e.target.files[0]);
    });

    function logMsg(msg, type = '') {
        const span = document.createElement('span');
        span.className = type ? `log-${type}` : '';
        span.innerText = msg + '\n';
        log.appendChild(span);
    }

    async function processFile(file) {
        log.innerHTML = '';
        logMsg(`[+] Загружен: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`);
        
        const ext = file.name.split('.').pop().toLowerCase();
        
        try {
            let cleanBlob;
            
            if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
                logMsg('Формат: Изображение. Применяем Canvas-рендеринг для 100% зачистки...');
                cleanBlob = await cleanImage(file);
            } 
            else if (['docx', 'xlsx', 'pptx'].includes(ext)) {
                logMsg('Формат: Office. Удаляем данные из docProps/core.xml и app.xml...');
                cleanBlob = await cleanOffice(file);
            }
            else if (ext === 'pdf') {
                logMsg('Формат: PDF. Уничтожаем метаданные документа...');
                cleanBlob = await cleanPDF(file);
            } 
            else {
                throw new Error('Неподдерживаемый формат файла.');
            }

            downloadBlob(cleanBlob, `clean_${file.name}`);
            logMsg('[✓] Файл успешно очищен и скачан!', 'success');
            
        } catch (err) {
            logMsg(`[x] Ошибка: ${err.message}`, 'error');
        }
    }

    function cleanImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const mimeType = file.type || 'image/jpeg';
                const quality = mimeType === 'image/jpeg' ? 1.0 : undefined;
                
                canvas.toBlob((blob) => {
                    blob ? resolve(blob) : reject(new Error('Не удалось создать Blob изображения'));
                }, mimeType, quality);
            };
            img.onerror = () => reject(new Error('Не удалось прочитать изображение'));
            img.src = URL.createObjectURL(file);
        });
    }

    async function cleanOffice(file) {
        const zip = await JSZip.loadAsync(file);
        const parser = new DOMParser();
        const serializer = new XMLSerializer();

        const coreFile = zip.file("docProps/core.xml");
        if (coreFile) {
            const xmlText = await coreFile.async("text");
            const xml = parser.parseFromString(xmlText, "application/xml");
            const tagsToClear = ['dc:title', 'dc:creator', 'dc:subject', 'dc:description', 'cp:keywords', 'cp:lastModifiedBy', 'dcterms:created', 'dcterms:modified'];
            
            tagsToClear.forEach(tag => {
                const el = xml.getElementsByTagName(tag)[0];
                if (el) el.textContent = '';
            });
            zip.file("docProps/core.xml", serializer.serializeToString(xml));
        }

        const appFile = zip.file("docProps/app.xml");
        if (appFile) {
            const xmlText = await appFile.async("text");
            const xml = parser.parseFromString(xmlText, "application/xml");
            const tagsToClear = ['Application', 'AppVersion', 'Company', 'Manager', 'Template', 'TotalTime'];
            
            tagsToClear.forEach(tag => {
                const el = xml.getElementsByTagName(tag)[0];
                if (el) el.textContent = '';
            });
            zip.file("docProps/app.xml", serializer.serializeToString(xml));
        }

        return zip.generateAsync({ type: "blob", mimeType: file.type });
    }

    async function cleanPDF(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
        
        pdfDoc.setTitle('');
        pdfDoc.setAuthor('');
        pdfDoc.setSubject('');
        pdfDoc.setKeywords([]);
        pdfDoc.setCreator('');
        pdfDoc.setProducer('');
        pdfDoc.setCreationDate(new Date('1970-01-01T00:00:00Z'));
        pdfDoc.setModificationDate(new Date('1970-01-01T00:00:00Z'));

        const pdfBytes = await pdfDoc.save();
        return new Blob([pdfBytes], { type: 'application/pdf' });
    }

    function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
